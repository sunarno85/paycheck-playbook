name: Auto reply comments

on:
  schedule:
    # Tiap 6 jam — balasan cepat sinyal aktif ke algoritma & pembaca
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Balas komentar baru
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python tool/auto_reply.py
      - name: Simpan daftar komentar terbalas
        run: |
          git config user.name "paycheck-playbook-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/replied_comments.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto reply comments"
            git push
          else
            echo "Tidak ada komentar baru."
          fi
