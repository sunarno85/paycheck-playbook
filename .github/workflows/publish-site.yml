name: Publish SEO site

on:
  push:
    branches: [main]
    paths:
      - 'content/bank.json'
      - 'tool/content/reels.json'
      - 'tool/build_site.py'
      - 'tool/panel/icon.png'
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bangun docs/
        run: python tool/build_site.py
      - name: Commit bila berubah
        run: |
          git config user.name "paycheck-playbook-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEO site"
            git push
          else
            echo "docs/ sudah mutakhir."
          fi
