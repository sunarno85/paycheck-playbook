name: Finish page setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render SVG ke PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/logo.svg", write_to="assets/logo.png")
          cairosvg.svg2png(url="assets/cover.svg", write_to="assets/cover.png")
          print("PNG siap")
          PY
      - name: Pasang ke Page
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python tool/apply_page_assets.py
