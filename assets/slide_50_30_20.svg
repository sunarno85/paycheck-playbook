<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F3D3E"/>
      <stop offset="1" stop-color="#071F2B"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <text x="80" y="160" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">The 50/30/20 Rule</text>
  <text x="80" y="225" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#A8DCD1">Split your take-home pay into 3 buckets</text>

  <rect x="80" y="330" width="920" height="150" rx="22" fill="#57C5B0"/>
  <text x="120" y="430" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#062A2A">50% NEEDS</text>
  <text x="900" y="430" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#062A2A">rent, food, utilities</text>

  <rect x="80" y="540" width="920" height="150" rx="22" fill="#E8A45C"/>
  <text x="120" y="640" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#3A2208">30% WANTS</text>
  <text x="900" y="640" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#3A2208">fun, eating out</text>

  <rect x="80" y="750" width="920" height="150" rx="22" fill="#8FE3D0"/>
  <text x="120" y="850" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#062A2A">20% FUTURE</text>
  <text x="900" y="850" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#062A2A">savings, investing</text>

  <text x="80" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#FFFFFF">Needs too high? Shrink the gap first.</text>
  <text x="80" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#FFFFFF">Then work toward the split.</text>
  <rect x="80" y="1160" width="180" height="8" rx="4" fill="#57C5B0"/>
  <text x="80" y="1240" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#A8DCD1">Save this for payday  •  @paycheckplaybook</text>
  <text x="80" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#7FB8AE">For educational purposes only. Not financial advice.</text>
</svg>
